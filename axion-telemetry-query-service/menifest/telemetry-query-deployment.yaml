apiVersion: apps/v1
kind: Deployment

metadata:
  name: telemetry-query-deployment
  namespace: axion
  labels:
    app: telemetry-query

spec:
  replicas: 1

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  selector:
    matchLabels:
      app: telemetry-query

  template:
    metadata:
      labels:
        app: telemetry-query

    spec:
      containers:
        - name: telemetry-query
          image: rishidevacr2026.azurecr.io/telemetry:v1 
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
