apiVersion: apps/v1
kind: Deployment

metadata:
  name: pgadmin-deployment
  namespace: axion
  labels:
    app: pgadmin

spec:
  replicas: 2

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1

  selector:
    matchLabels:
      app: pgadmin

  template:
    metadata:
      labels:
        app: pgadmin

    spec:
      containers:
        - name: pgadmin
          image: dpage/pgadmin4:latest

          ports:
            - name: http
              containerPort: 80
              protocol: TCP

          env:
            - name: PGADMIN_DEFAULT_EMAIL
              value: "admin@axion.com"

            - name: PGADMIN_DEFAULT_PASSWORD
              value: "CHANGE_ME_STRONG_PASSWORD"

          