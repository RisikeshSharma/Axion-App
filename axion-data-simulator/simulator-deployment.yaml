apiVersion: apps/v1
kind: Deployment

metadata:
  name: simulator-deployment
  namespace: axion
  labels:
    app: simulator

spec:
  replicas: 2

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1

  selector:
    matchLabels:
      app: simulator

  template:
    metadata:
      labels:
        app: simulator

    spec:
      containers:
        - name: simulator
          image: rishidevacr2026.azurecr.io/simulator:v1
          imagePullPolicy: Always

          